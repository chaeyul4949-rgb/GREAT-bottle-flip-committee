<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="google-site-verification" content="mVj35GvGb1fgDlgSLk_hK5wVBtDJgHRkZWj6kXkvYmg" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 검색 키워드 및 사이트 설명 추가 -->
<title>물병 세우기 게임 - 대단한 물병 세우기 위원회 | 온라인 물병게임</title>
<meta name="description" content=""심플한 조작과 화려한 스킬, 스릴 넘치는 미니게임까지 더해진 막강한 몰입감의 3D 타임킬링 온라인 물병 세우기 게임 지금바로 이 게임을 플레이하세요!"
<meta name="keywords" content="물병게임, 물병세우기, 물병세우기게임, 물병 던지기, bottle flip, 무료 웹게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1d1f; --panel:#2a2b2e; --panel2:#333438; --panel3:#3d3e43; --line:#45464b;
  --text:#e6e4e0; --mute:#8e8f93;
  --bronze:#a57d4f; --bronze-d:#6d5233; --edge:#2b1d12; --tan:#cfa46b; --bz-bg:#1e2528;
  --gold:#f0b429; --green:#3fae62; --mint:#9fe3b8; --red:#e0352b; --blue:#6f9bff; --fever:#ff8a1f;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1c1d1f; } }
:root[data-theme="dark"]{ --bg:#1c1d1f; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.disp{font-family:"Black Han Sans","Gothic A1","Apple SD Gothic Neo",sans-serif;font-weight:400}
button,input{font-family:inherit;color:inherit}
.app{max-width:1360px;margin:0 auto;padding:12px 14px 22px}

/* plain gray surfaces */
.panel{background:var(--panel);border-radius:8px}
.btn{background:var(--panel3);border:0;border-radius:6px;color:var(--text);cursor:pointer}
.btn:hover:not(:disabled){background:#484a50}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{color:#6c6d71;cursor:not-allowed}
/* bronze accent: only for the few key actions */
.bz{background:var(--bz-bg);border:2px solid var(--bronze);border-radius:6px;color:var(--tan);cursor:pointer;box-shadow:0 0 0 2px var(--edge)}
.bz:hover:not(:disabled){background:#27313a;border-color:#c49a66}
.bz:active:not(:disabled){transform:translateY(1px)}
.bz:disabled{border-color:var(--bronze-d);color:#6f6556;cursor:not-allowed}

.framed{background:#121517;border:2px solid var(--bronze);border-radius:8px;box-shadow:0 0 0 3px var(--edge),inset 0 0 0 1px rgba(0,0,0,.5),0 8px 18px rgba(0,0,0,.45)}
/* ---------- top bar ---------- */
.topbar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.brand{display:flex;align-items:center;padding:0 10px 0 4px;font-size:23px;color:var(--tan);white-space:nowrap}
.stagebtn{flex:1;min-width:250px;padding:8px 14px;text-align:left;color:var(--text);background:#121517}
.stagebtn:hover:not(:disabled){background:#171b1e}
.sp-top{display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden}
.sp-code{color:var(--bg);background:var(--text);padding:1px 8px;border-radius:4px;font-size:15px}
.sp-name{font-size:20px;overflow:hidden;text-overflow:ellipsis}
.sp-year{font-size:12px;font-weight:900;color:var(--tan)}
.sp-mult{margin-left:auto;font-size:12px;font-weight:900;color:var(--mute)}
.sp-bar{height:5px;background:#262a2d;border-radius:3px;margin-top:7px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.sp-sub{font-size:12px;font-weight:700;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextbtn{background:#121517;padding:0 18px;min-width:140px;font-size:19px;line-height:1.15}
.nextbtn small{display:block;font-family:"Gothic A1",sans-serif;font-size:12px;font-weight:900;color:var(--text)}
.wallet{padding:5px 16px;display:flex;flex-direction:column;justify-content:center;min-width:150px}
.wallet .g{font-size:25px;line-height:1.05;display:flex;align-items:center;gap:8px;color:var(--gold)}
.wallet .g::before{content:"";width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#9a6b00)}
.wallet .p{font-size:13px;font-weight:900;color:var(--blue)}
.wallet.bump .g{animation:bump .25s}
@keyframes bump{50%{transform:translateY(-3px)}}
.iconbtn{width:50px;font-size:20px}
@media (max-width:900px){ .brand{display:none} .stagebtn{flex-basis:100%} .nextbtn{flex:1;height:54px} }

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;margin-top:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.stage{position:relative;height:clamp(500px,66vh,780px);background:#9fd8ff;border-radius:8px;overflow:hidden}
@media (max-width:560px){.stage{height:470px}}
#cv{width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.hud{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.plate{background:rgba(28,29,31,.85);border-radius:6px;padding:6px 14px 7px;min-width:96px}
.plate .lab{font-size:11px;font-weight:900;color:var(--mute)}
.plate .val{font-size:30px;line-height:1;color:var(--gold)}
.plate .ext{font-size:11px;font-weight:700;color:var(--mute);margin-top:3px}
#hBig{color:#8fc2ff}
.buffs{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.buff{background:rgba(28,29,31,.85);border-radius:6px;padding:5px 12px;font-size:14px;font-weight:900}
.buff.gold{color:var(--gold)}
.buff.jp{color:#ff6b5f}

/* ---------- deck ---------- */
.deck{margin-top:16px;padding:14px 16px 16px}
.fever{display:flex;align-items:center;gap:10px}
.fever .tag{font-size:16px;color:var(--fever);min-width:40px}
.fever .track{position:relative;flex:1;height:20px;background:#0b0d0e;border:1px solid var(--bronze-d);border-radius:4px;overflow:hidden}
.fever-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#b35300,var(--fever));transition:width .12s linear}
.fever.on .fever-fill{background:linear-gradient(90deg,#c21f00,#ff6a1f,#ffc04a);animation:glow .4s infinite alternate}
@keyframes glow{to{filter:brightness(1.35)}}
.fever .txt{position:relative;padding:0 10px;line-height:20px;font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.deckrow{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;margin-top:14px;align-items:start}
@media (max-width:680px){.deckrow{grid-template-columns:1fr}}
.meter{position:relative;height:60px;background:#0b0d0e;border:1px solid var(--bronze-d);border-radius:6px;overflow:hidden;transition:opacity .15s}
.meter.dim{opacity:.5}
.zone{position:absolute;top:0;bottom:0}
.zone.ok{background:var(--green)}
.zone.pf{background:var(--mint)}
.zone.rv{background:var(--gold)}
.zone.jp{background:var(--red);box-shadow:0 0 10px 2px rgba(255,60,40,.9);animation:jp .3s infinite alternate}
@keyframes jp{to{background:#ff8a7a}}
.needle{position:absolute;top:0;bottom:0;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 1px #000,0 0 6px rgba(255,255,255,.6)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--mute);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.throw{position:relative;overflow:hidden;width:100%;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(180deg,#121618,#0b0e0f);box-shadow:0 0 0 2px var(--edge),inset 0 2px 6px rgba(0,0,0,.6)}
.throw:hover:not(:disabled){background:linear-gradient(180deg,#161b1e,#0e1113)}
.throw .t1{font-size:31px;line-height:1}
.throw .t2{font-size:11px;font-weight:900;color:var(--mute)}
.throw .cdbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--tan);transform-origin:left;transform:scaleX(0)}
.throw.wait .t1{color:#7d6a50}
.throw.fever{border-color:var(--fever);box-shadow:0 0 0 2px var(--edge),0 0 14px rgba(255,138,31,.55)}
.throw.fever .t1{color:#ffb35a}
.throw.fever .cdbar{background:var(--fever)}
.minis{display:flex;gap:6px;margin-top:10px}
.mini{flex:1;height:34px;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;background:#0d1012;border:1px solid var(--bronze-d);color:var(--tan)}
.mini:hover:not(:disabled){background:#171b1e;border-color:var(--bronze)}
.skillbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.skillbar:empty{display:none}
.sbar{position:relative;overflow:hidden;flex:1;min-width:100px;padding:6px 10px;text-align:left;background:#0d1012;border:1px solid var(--bronze-d)}
.sbar:hover:not(:disabled){background:#171b1e}
.sbar b{display:block;font-size:14px;font-weight:900}
.sbar span{font-size:11px;font-weight:700;color:var(--mute)}
.sbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:rgba(0,0,0,.4);transform-origin:left;transform:scaleX(0);pointer-events:none}
.sbar.act{background:#2f4470}
.sbar.act span{color:#c7d6ff}
.sbar.on{background:#285a3a}
.sbar.on span{color:#c9f2d6}
.info{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:auto auto;gap:3px 12px;background:rgba(28,29,31,.85);border-radius:6px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--mute);pointer-events:none}
.info b{color:var(--text);font-weight:900;text-align:right}
.info b.g{color:var(--gold)}

/* ---------- side ---------- */
.side{overflow:hidden}
.tabs{display:flex;background:#232427}
.tab{flex:1;border:0;background:transparent;color:var(--mute);padding:11px 2px 9px;font-size:17px;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--tan);border-bottom-color:var(--bronze);background:var(--panel)}
.pane{max-height:calc(66vh + 250px);overflow:auto;padding:2px 12px 12px}
.pane-head{font-size:12px;font-weight:700;color:var(--mute);line-height:1.5;padding:10px 0 8px;border-bottom:1px solid var(--line)}
.up{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.up .ic{font-size:19px;text-align:center}
.up.noic{grid-template-columns:1fr auto}
.up.skl{grid-template-columns:40px 1fr auto}
.skic{width:40px;height:40px;background:#f4ecd8;border:2px solid #141414;border-radius:8px;box-shadow:2px 2px 0 #141414;padding:3px;transform:rotate(-3deg)}
.up.skl:nth-child(even) .skic{transform:rotate(3deg)}
.skic svg{width:100%;height:100%;display:block}
.up.skl .nm em{white-space:nowrap}
.sbar{display:flex;align-items:center;gap:8px}
.sbar .skic{width:32px;height:32px;flex:none;padding:2px;box-shadow:1.5px 1.5px 0 #141414}
.sbar .sbt{min-width:0;overflow:hidden}
.sbar .sbt b,.sbar .sbt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar{min-width:150px}
.sbar:disabled .skic{filter:grayscale(1) brightness(.7)}
.up .nm{font-size:14px;font-weight:900}
.up .nm em{font-style:normal;font-size:11px;font-weight:900;color:var(--mute);margin-left:6px}
.up .ef{font-size:12px;font-weight:500;color:var(--mute);margin-top:3px;line-height:1.35}
.buy{background:var(--panel3);border:0;border-radius:6px;padding:8px;min-width:76px;font-weight:900;font-size:13px;cursor:pointer;color:var(--gold)}
.buy:hover:not(:disabled){background:#484a50}
.buy.pt{color:var(--blue)}
.buy:disabled{background:#2f3033;color:#66676b;cursor:not-allowed}
.buy.eq{color:var(--text)}
.buy.using{background:transparent;color:var(--mint);box-shadow:inset 0 0 0 2px var(--green)}
.up.sk{grid-template-columns:34px 1fr auto}
.up.sk canvas{width:34px;height:68px}
.rec{display:grid;grid-template-columns:1fr auto;font-size:14px;font-weight:700;margin-top:6px}
.rec span{padding:7px 0;border-bottom:1px solid var(--line)}
.rec span:nth-child(odd){color:var(--mute)}
.stories{display:flex;flex-direction:column;margin-top:14px}
.stories div{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.stories b{display:block;font-size:12px;font-weight:900;color:var(--tan);margin-bottom:2px}
.reset{margin-top:14px;width:100%;border:0;background:transparent;color:#d06a5a;padding:10px;font-weight:900;font-size:13px;cursor:pointer;text-decoration:underline}

/* ---------- modal (bronze frame) ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,8,9,.72)}
.mcard{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--bz-bg);border:2px solid var(--bronze);border-radius:8px;box-shadow:0 0 0 3px var(--edge),0 12px 30px rgba(0,0,0,.6);animation:drop .22s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.m-band{display:flex;align-items:center;gap:10px;padding:16px 22px 0}
.m-band .a{color:var(--bz-bg);background:var(--tan);padding:2px 10px;border-radius:4px;font-size:15px}
.m-band .b{font-size:13px;font-weight:900;color:var(--mute)}
.m-body{padding:10px 22px 22px}
.m-title{font-size:32px;line-height:1.15;margin:0 0 12px;color:var(--tan)}
.m-story{font-size:18px;line-height:1.75;font-weight:700;margin:0 0 16px;min-height:3.5em;padding:12px 16px;background:#161b1d;border-left:3px solid var(--bronze);border-radius:4px}
.m-meta{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.m-meta b{color:var(--gold)}
.m-btns{display:flex;gap:10px;margin-top:18px}
.mbtn{flex:1;padding:13px;font-size:19px}
.mbtn.primary{background:var(--bz-bg);border:2px solid var(--bronze);color:var(--tan);box-shadow:0 0 0 2px var(--edge)}
.mbtn.primary:hover:not(:disabled){background:#27313a}
.chap{margin-bottom:16px}
.chap h3{margin:0;font-size:20px;font-weight:400;color:var(--tan)}
.chap p{margin:2px 0 8px;font-size:12px;font-weight:700;color:var(--mute)}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:480px){.sgrid{grid-template-columns:repeat(3,1fr)}}
.sbtn{background:var(--panel2);border:0;border-radius:6px;padding:8px 4px;cursor:pointer;text-align:center;min-height:68px;color:var(--text)}
.sbtn:hover:not(:disabled){background:var(--panel3)}
.sbtn b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:18px}
.sbtn span{display:block;font-size:11px;font-weight:700;color:var(--mute);margin-top:2px;line-height:1.25}
.sbtn.done{box-shadow:inset 0 -3px 0 var(--green)}
.sbtn.cur{box-shadow:inset 0 0 0 2px var(--gold);background:#3a3524}
.sbtn.buyable{box-shadow:inset 0 0 0 2px var(--tan)}
.sbtn:disabled{opacity:.4;cursor:not-allowed}
/* gambling popups */
.gbox{background:#161b1d;border-radius:6px;padding:12px}
.g-row{display:flex;gap:8px;align-items:center}
.g-row input{flex:1;min-width:0;height:42px;background:#0f1214;border:1px solid var(--line);border-radius:5px;padding:0 10px;font-size:17px;font-weight:900;color:var(--gold)}
.g-row input:focus{outline:2px solid var(--bronze)}
.g-quick{display:flex;gap:6px;margin-top:8px}
.g-quick button{flex:1;height:32px;font-size:12px;font-weight:900}
.coinstage{display:flex;justify-content:center;padding:10px 0 16px}
.coin3d{width:96px;height:96px;perspective:400px}
.coin3d .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.coin3d .f{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Black Han Sans",sans-serif;font-size:28px;backface-visibility:hidden}
.coin3d .h{background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 55%,#9a6b00);color:#3a2600;box-shadow:inset 0 0 0 5px #c98f00}
.coin3d .t{background:radial-gradient(circle at 35% 30%,#d0d0d0,#7d7d7d 60%,#444);color:#222;box-shadow:inset 0 0 0 5px #666;transform:rotateY(180deg)}
.g-res{min-height:22px;margin-top:10px;font-size:15px;font-weight:900;text-align:center;color:var(--mute)}
.g-res.win{color:var(--gold)} .g-res.lose{color:#ff6b5f}
.cups{position:relative;height:170px;margin:6px auto 10px;width:340px;max-width:100%;background:#161b1d;border-radius:6px;overflow:hidden}
.cups .table{position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,#3d2a1a,#2a1c10)}
.cup{position:absolute;bottom:34px;width:86px;height:100px;transition:left .18s ease-in-out,transform .35s ease-out;cursor:default;border:0;padding:0;background:none}
.cup::before{content:"";position:absolute;inset:0;clip-path:polygon(14% 0,86% 0,100% 100%,0 100%);background:linear-gradient(90deg,#8d1c14,#d8392b 40%,#e8574a 55%,#9c2118)}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:#7a150f}
.cups.pick .cup{cursor:pointer}
.cups.pick .cup:hover{transform:translateY(-6px)}
.cup.up{transform:translateY(-62px)!important}
.ball{position:absolute;bottom:36px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8e0d2 50%,#9a9186);opacity:0}
.ball.show{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- frame rule: only outer boxes get the bronze frame; blocks inside them stay borderless ---------- */
.topbar>.stagebtn,.topbar>.nextbtn,.topbar>.wallet,.topbar>.iconbtn,.stage,.deck,.side,.mcard{
  border:2px solid var(--bronze);border-radius:10px;
  box-shadow:0 0 0 2px var(--edge),inset 0 1px 0 rgba(255,214,160,.14),0 8px 18px rgba(0,0,0,.45)}
.mcard{box-shadow:0 0 0 2px var(--edge),inset 0 1px 0 rgba(255,214,160,.14),0 14px 34px rgba(0,0,0,.6)}
.topbar>.wallet,.topbar>.iconbtn,.side{background:#121517}
.topbar>.iconbtn:hover:not(:disabled){background:#171b1e;border-color:#c49a66}
.side .tab.on{background:#1a1e21}
/* inner blocks: no borders, separated by fill instead */
.fever .track,.meter,.mini,.sbar,.g-row input{border:0}
.fever .track,.meter{background:#07090a}
.mini,.sbar{background:#1c2124}
.mini:hover:not(:disabled),.sbar:hover:not(:disabled){background:#252b2f;border:0}
.throw{border:0;color:#1e1409;background:linear-gradient(180deg,#c9a06c,var(--bronze));box-shadow:inset 0 -3px 0 rgba(0,0,0,.28)}
.throw:hover:not(:disabled){background:linear-gradient(180deg,#d6ae78,#b18758)}
.throw .t2{color:rgba(30,20,9,.72)}
.throw .cdbar{background:#1e1409}
.throw.wait .t1{color:rgba(30,20,9,.45)}
.throw:disabled{background:#3a3226;color:#6f6556}
.throw.fever{background:linear-gradient(180deg,#ffbb66,var(--fever));box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 14px rgba(255,138,31,.55)}
.throw.fever .t1{color:#2a1200}
.throw.fever .cdbar{background:#2a1200}
.throw:focus-visible,.mini:focus-visible,.sbar:focus-visible{outline:2px solid var(--tan);outline-offset:2px}
.mbtn:focus-visible{outline:none;filter:brightness(1.15)}
.m-story{border-left:0}
.mbtn.primary{border:0;box-shadow:none;background:var(--bronze);color:#1e1409}
.mbtn.primary:hover:not(:disabled){background:#c49a66}
.skic,.sbar .skic{border:0;box-shadow:none}
.sbtn.cur{box-shadow:none;background:#4a4128;color:var(--gold)}
.sbtn.buyable{box-shadow:none;background:#3b3326;color:var(--tan)}
.buy.using{box-shadow:none;background:#1f3a29}

/* meter zones: muted celadon + antique brass, flat (no glow) */

          <span>쿨타임</span><b><span id="iCd">0</span>초</b>

      </div>
      <div class="deck framed">

            <div class="meter" id="meter">

              <span><i style="background:var(--z-rv)"></i>거꾸로 ×10 · 30pt</span>
              <span><i style="background:var(--red)"></i>가끔 나오는 잭팟 ×100 · 150pt</span>

            <div class="skillbar" id="skillbar"></div>

              <button class="mini btn" id="yabBtn"> 야바위 하기</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside class="side panel">

        <button class="tab disp on" data-tab="up">강화</button>
        <button class="tab disp" data-tab="skin">스킨</button>
        <button class="tab disp" data-tab="skill">스킬</button>

        <button class="reset" id="resetBtn">처음부터 다시 하기</button>
      </div>
    </aside>
  </div>
</div>

let AC=null;
function beep(f,d,type='sine',v=0.07,delay=0){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.03);
  }catch(e){}
}
let NB=null;
function noise(dur,vol,freq,q,delay=0){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(!NB){ NB=AC.createBuffer(1,Math.floor(AC.sampleRate*0.6),AC.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const t=AC.currentTime+delay, src=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
    src.buffer=NB; f.type='bandpass'; f.frequency.value=freq; f.Q.value=q;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(AC.destination); src.start(t); src.stop(t+dur+0.02);
  }catch(e){}
}
function thud(f0,dur,vol,delay=0){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f0*0.45,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function landSound(surf,k){ // k: impact strength 0.3..1

  // water slosh inside the bottle

}

  const rw=Math.max(0.032,0.045-S.stage*0.0006); let rv=null;
  for(let i=0;i<30 && !rv;i++){

      if(clearOk && clearRv) jp=[s,s+jw];

const groundY = () => H-100;
const supportH = a => (BH/2*Math.abs(Math.cos(a)) + BW/2*Math.abs(Math.sin(a)))*SC;
const scrY = altPx => groundY() - altPx + camAlt;

function rng(seed){ seed=seed%2147483647; if(seed<=0) seed+=2147483646; return ()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }
const R0=rng(42);
const STARS=Array.from({length:170},()=>({x:R0(),y:R0(),r:R0()*1.6+0.3,d:0.3+R0()*0.7,tw:R0()*TAU}));
const CLOUDS=Array.from({length:50},()=>({alt:15+R0()*190,x:R0(),s:50+R0()*110,v:(R0()-0.5)*0.01}));
const BGCLOUDS=Array.from({length:6},()=>({x:R0(),y:0.08+R0()*0.3,s:40+R0()*60,v:0.004+R0()*0.006}));

function hex2rgb(h){ h=h.replace('#',''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
STAGES.forEach(s=>{ s.skyK=[[0,hex2rgb(s.sky[0])],[60,hex2rgb(s.sky[1])],[300,hex2rgb(s.sky[2])],[700,[3,4,11]],[1e9,[2,3,9]]]; });
function skyAt(st,m){
  const K=st.skyK; if(m<=0) return K[0][1];
  for(let i=1;i<K.length;i++){ if(m<=K[i][0]){ const a=K[i-1],b=K[i],t=(m-a[0])/(b[0]-a[0]); return a[1].map((v,k)=>Math.round(v+(b[1][k]-v)*t)); } }
  return K[K.length-1][1];
}
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
// ---------- scene helpers ----------
function circ(c,x,y,r){ c.beginPath(); c.arc(x,y,r,0,TAU); c.fill(); }
function tri(c,x1,y1,x2,y2,x3,y3){ c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.lineTo(x3,y3); c.closePath(); c.fill(); }
function hill(c,x,y,rx,ry){ c.beginPath(); c.ellipse(x,y,rx,ry,0,Math.PI,TAU); c.closePath(); c.fill(); }
function towers(c,r,n,base,minH,maxH,col,winCol,winP){
  const arr=[];
  c.fillStyle=col;
  for(let i=0;i<n;i++){ const x=r()*W*1.1-W*0.05, w=(0.04+r()*0.07)*W, h=minH+r()*(maxH-minH); arr.push([x,w,h]); c.fillRect(x,base-h,w,h+H); }
  if(winCol){ c.fillStyle=winCol; for(const [x,w,h] of arr){ for(let wy=base-h+10; wy<base-8; wy+=15){ for(let wx=x+5; wx<x+w-6; wx+=10){ if(r()<winP) c.fillRect(wx,wy,4,6); } } } }
  return arr;
}
function gear(c,x,y,rad,teeth,ang,col){
  c.save(); c.translate(x,y); c.rotate(ang); c.fillStyle=col;
  for(let i=0;i<teeth;i++){ c.save(); c.rotate(i*TAU/teeth); c.fillRect(-rad*0.14,-rad-rad*0.22,rad*0.28,rad*0.4); c.restore(); }
  circ(c,0,0,rad); c.fillStyle='rgba(0,0,0,0.35)'; circ(c,0,0,rad*0.35); c.restore();
}

function drawDeco(st){
  const d=st.deco; if(!d) return;
  const p=camAlt*0.05;
  if(d==='sun'||d==='bigsun'){
    const x=W*0.8, y=H*0.2+p, r=d==='bigsun'?60:38;
    const g=ctx.createRadialGradient(x,y,r*0.3,x,y,r*3); g.addColorStop(0,'rgba(255,250,220,0.9)'); g.addColorStop(1,'rgba(255,240,200,0)');
    ctx.fillStyle=g; circ(ctx,x,y,r*3); ctx.fillStyle='#fffbe8'; circ(ctx,x,y,r);
  } else if(d==='sunset'){
    const x=W*0.25, y=H*0.55+p, r=55;
    const g=ctx.createRadialGradient(x,y,r*0.3,x,y,r*3.5); g.addColorStop(0,'rgba(255,190,120,0.8)'); g.addColorStop(1,'rgba(255,150,100,0)');
    ctx.fillStyle=g; circ(ctx,x,y,r*3.5); ctx.fillStyle='#ffd08a'; circ(ctx,x,y,r);
  } else if(d==='moon'){
    const x=W*0.78, y=H*0.18+p; ctx.fillStyle='#f3efd9'; circ(ctx,x,y,32);
    ctx.fillStyle=rgb(skyAt(st,20)); circ(ctx,x+12,y-6,28);
  } else if(d==='earth'){
    const x=W*0.75, y=H*0.2+p, r=Math.min(70,W*0.11);
    ctx.fillStyle='#2a6fd6'; circ(ctx,x,y,r);
    ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.clip();
    ctx.fillStyle='#3fa34d'; circ(ctx,x-r*0.3,y-r*0.2,r*0.4); circ(ctx,x+r*0.35,y+r*0.3,r*0.3);
    ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fillRect(x-r,y-r*0.55,r*2,r*0.12);
    ctx.fillStyle='rgba(0,0,0,0.45)'; circ(ctx,x+r*0.55,y+r*0.2,r*0.95); ctx.restore();
  } else if(d==='marsmoons'){
    ctx.fillStyle='#d8c8b8'; circ(ctx,W*0.7,H*0.16+p,14); circ(ctx,W*0.84,H*0.28+p,8);
  } else if(d==='saturn'){
    const x=W*0.7, y=H*0.24+p, r=Math.min(80,W*0.13);
    ctx.strokeStyle='rgba(230,205,160,0.9)'; ctx.lineWidth=r*0.12;
    ctx.beginPath(); ctx.ellipse(x,y,r*2,r*0.5,-0.3,Math.PI,TAU); ctx.stroke();
    const g=ctx.createLinearGradient(x,y-r,x,y+r); g.addColorStop(0,'#f1d8a8'); g.addColorStop(.5,'#c9a36a'); g.addColorStop(1,'#8a6a40');
    ctx.fillStyle=g; circ(ctx,x,y,r);
    ctx.beginPath(); ctx.ellipse(x,y,r*2,r*0.5,-0.3,0,Math.PI); ctx.stroke(); ctx.lineWidth=1;
  } else if(d==='blackhole'){
    const x=W*0.5, y=H*0.26+p, r=Math.min(55,W*0.09);
    const g=ctx.createRadialGradient(x,y,r,x,y,r*4); g.addColorStop(0,'rgba(255,150,60,0.55)'); g.addColorStop(1,'rgba(120,40,160,0)');
    ctx.fillStyle=g; circ(ctx,x,y,r*4);
    ctx.save(); ctx.translate(x,y); ctx.rotate(-0.15);
    for(let i=0;i<3;i++){ ctx.strokeStyle=`rgba(255,${170+i*30},${80+i*40},${0.8-i*0.2})`; ctx.lineWidth=10-i*3; ctx.beginPath(); ctx.ellipse(0,0,r*(2.4-i*0.25),r*(0.5-i*0.05),time*0.5,0,TAU); ctx.stroke(); }
    ctx.restore(); ctx.fillStyle='#000'; circ(ctx,x,y,r); ctx.lineWidth=1;
  } else if(d==='clocks'){
    for(let i=0;i<5;i++){
      const x=W*(0.12+i*0.19), y=H*(0.18+((i*37)%5)*0.06)+camAlt*0.1, r=18+i*5;
      ctx.strokeStyle='rgba(200,170,255,0.7)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke();
      const a1=time*(0.5+i*0.3)*(i%2?1:-1), a2=a1*12;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a1)*r*0.5,y+Math.sin(a1)*r*0.5); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a2)*r*0.8,y+Math.sin(a2)*r*0.8); ctx.stroke();
    }
    ctx.lineWidth=1;
  }
}

function drawProps(st){
  const gy=groundY(), f=gy+50+camAlt*0.3, n=gy+50+camAlt*0.6, c=ctx;
  if(f-400>H) return;
  const r=rng(st.i*977+11);
  switch(st.props){
  case 'park':
    c.fillStyle='#8cc47a'; hill(c,W*0.1,f,W*0.35,90); hill(c,W*0.6,f,W*0.4,70); hill(c,W*1.0,f,W*0.3,110); c.fillRect(0,f,W,H);
    for(let i=0;i<9;i++){ const x=r()*W, s=0.8+r()*0.5;
      c.fillStyle='#5a3f2a'; c.fillRect(x-4*s,n-55*s,8*s,55*s);
      c.fillStyle=i%2?'#3f7d34':'#4a8e3c'; circ(c,x,n-70*s,28*s); circ(c,x-20*s,n-55*s,20*s); circ(c,x+20*s,n-55*s,20*s); }
    break;
  case 'rooftop':
    towers(c,r,16,f,80,280,'#8f82a8','rgba(255,240,200,0.45)',0.2);
    c.fillStyle='#4b515c'; c.fillRect(0,n-48,W,5); c.fillRect(0,n-26,W,4);
    for(let x=0;x<W;x+=44) c.fillRect(x,n-48,4,48);
    c.fillStyle='#6a707c'; c.fillRect(W*0.86,n-120,56,50); c.fillRect(W*0.86+6,n-70,5,70); c.fillRect(W*0.86+45,n-70,5,70);
    break;
  case 'beach':{
    c.fillStyle='#1f7fc4'; c.fillRect(0,f-36,W,H);
    c.strokeStyle='rgba(255,255,255,0.5)'; c.lineWidth=2;
    for(let k=0;k<4;k++){ c.beginPath(); for(let x=0;x<=W;x+=12){ const y=f-30+k*9+Math.sin(x*0.03+time*2+k)*2; x?c.lineTo(x,y):c.moveTo(x,y);} c.stroke(); }
    c.lineWidth=1;
    for(const [x,dir] of [[W*0.07,1],[W*0.93,-1]]){
      c.strokeStyle='#7a5a3a'; c.lineWidth=10; c.beginPath(); c.moveTo(x,n); c.quadraticCurveTo(x+dir*10,n-90,x+dir*30,n-170); c.stroke();
      c.strokeStyle='#2f8a3c'; c.lineWidth=7;
      for(let k=0;k<6;k++){ const a=-Math.PI/2+(k-2.5)*0.55; c.beginPath(); c.moveTo(x+dir*30,n-170); c.quadraticCurveTo(x+dir*30+Math.cos(a)*50,n-170+Math.sin(a)*50-10,x+dir*30+Math.cos(a)*80,n-170+Math.sin(a)*30+30); c.stroke(); }
      c.lineWidth=1;
    }
    break;}
  case 'snow':
    for(let i=0;i<7;i++){ const x=i*W/5.5+r()*60-40, h=160+r()*150, w=120+r()*90;
      c.fillStyle='#8196b3'; tri(c,x-w,f,x,f-h,x+w,f);
      c.fillStyle='#ffffff'; tri(c,x-w*0.3,f-h*0.7,x,f-h,x+w*0.3,f-h*0.7); }
    c.fillStyle='#8196b3'; c.fillRect(0,f,W,H);
    for(let i=0;i<10;i++){ const x=r()*W, s=0.7+r()*0.6;
      c.fillStyle='#2e4f3e'; for(let k=0;k<3;k++) tri(c,x-28*s+k*5*s,n-k*28*s,x,n-60*s-k*28*s,x+28*s-k*5*s,n-k*28*s);
      c.fillStyle='rgba(255,255,255,0.85)'; tri(c,x-10*s,n-100*s,x,n-116*s,x+10*s,n-100*s); }
    break;
  case 'city':
    towers(c,r,18,f,100,300,'#1f2248','rgba(255,216,107,0.55)',0.3);
    towers(c,r,12,n,60,220,'#11132a','rgba(255,233,168,0.8)',0.35);
    break;
  case 'launch':
    c.fillStyle='#5b5470'; hill(c,W*0.2,f,W*0.4,80); hill(c,W*0.8,f,W*0.4,60); c.fillRect(0,f,W,H);
    { const x=W*0.84, top=n-260;
      c.strokeStyle='#c24a3a'; c.lineWidth=3; c.strokeRect(x,top,34,260);
      for(let y=top;y<n;y+=26){ c.beginPath(); c.moveTo(x,y); c.lineTo(x+34,y+26); c.moveTo(x+34,y); c.lineTo(x,y+26); c.stroke(); }
      c.lineWidth=1;
      const rx=x-48; c.fillStyle='#f2f2f2'; c.fillRect(rx,top+40,38,200);
      c.fillStyle='#d23b2e'; tri(c,rx,top+40,rx+19,top-10,rx+38,top+40); tri(c,rx-14,n,rx,n-50,rx,n); tri(c,rx+52,n,rx+38,n-50,rx+38,n);
      c.fillStyle='#222'; circ(c,rx+19,top+80,7); }
    break;
  case 'moon':
    c.fillStyle='#5c5c64'; hill(c,W*0.15,f,W*0.35,60); hill(c,W*0.7,f,W*0.5,45); c.fillRect(0,f,W,H);
    c.fillStyle='#6e6e76'; c.fillRect(0,n-10,W,H);
    c.fillStyle='#55555d'; for(let i=0;i<7;i++){ const x=r()*W, rr=20+r()*40; c.beginPath(); c.ellipse(x,n+5+r()*20,rr,rr*0.25,0,0,TAU); c.fill(); }
    c.fillStyle='#ddd'; c.fillRect(W*0.15,n-110,3,110); c.fillStyle='#e8e8e8'; c.fillRect(W*0.15+3,n-110,46,28);
    c.fillStyle='#b0b0b8'; c.fillRect(W*0.15+10,n-100,30,3); c.fillRect(W*0.15+10,n-92,22,3);
    break;
  case 'mars':
    c.fillStyle='#8a3a22';
    for(let i=0;i<5;i++){ const x=r()*W, w=80+r()*120, h=60+r()*120; c.beginPath(); c.moveTo(x-w,f); c.lineTo(x-w*0.6,f-h); c.lineTo(x+w*0.6,f-h); c.lineTo(x+w,f); c.fill(); }
    c.fillRect(0,f,W,H);
    for(const x of [W*0.12,W*0.3,W*0.86]){ c.fillStyle='#e8e2da'; hill(c,x,n,48,44); c.fillStyle='#6fb8e8'; c.fillRect(x-14,n-28,28,10); }
    c.strokeStyle='#ccc'; c.lineWidth=2; c.beginPath(); c.moveTo(W*0.86,n-44); c.lineTo(W*0.86,n-100); c.stroke(); c.lineWidth=1;
    c.fillStyle='#ff5040'; circ(c,W*0.86,n-100,4);
    break;
  case 'saturn':
    c.fillStyle='#5a5448';
    for(let i=0;i<12;i++){ const x=r()*W, y=f-r()*160, s=6+r()*18; c.beginPath(); c.moveTo(x-s,y); c.lineTo(x-s*0.3,y-s*0.8); c.lineTo(x+s,y-s*0.3); c.lineTo(x+s*0.6,y+s*0.6); c.closePath(); c.fill(); }
    c.fillStyle='#6e6656'; c.fillRect(0,f,W,H);
    c.fillStyle='#8a7d68'; for(let i=0;i<8;i++){ const x=r()*W, s=14+r()*30; tri(c,x-s,n,x-s*0.2,n-s*1.2,x+s,n); }
    break;
  case 'blackhole':
    c.fillStyle='#241a33'; c.fillRect(0,f-20,W,H);
    c.fillRect(W*0.1,f-120,20,100); c.fillRect(W*0.06,f-120,140,14); c.fillRect(W*0.7,f-90,120,12); c.fillRect(W*0.78,f-160,14,140);
    c.fillStyle='#ff4ad0'; circ(c,W*0.1+10,f-126,4); circ(c,W*0.78+7,f-166,4);
    c.fillStyle='#342646'; for(let i=0;i<8;i++){ const x=r()*W, y=n-r()*200, s=6+r()*14, a=time*0.3+i;
      c.save(); c.translate(x,y+Math.sin(time+i)*8); c.rotate(a); c.fillRect(-s,-s*0.4,s*2,s*0.8); c.restore(); }
    break;
  case 'palace':
    c.fillStyle='#9a8aa8'; hill(c,W*0.2,f,W*0.4,110); hill(c,W*0.75,f,W*0.45,90); c.fillRect(0,f,W,H);
    { const x=W*0.5, ry=n-150;
      c.fillStyle='#e8dcc2'; c.fillRect(x-150,ry+18,300,150);
      c.fillStyle='#8e2b24'; for(let k=-4;k<=4;k++) c.fillRect(x+k*34-5,ry+18,10,150);
      c.fillStyle='#2f2f38'; c.beginPath(); c.moveTo(x-190,ry-8); c.quadraticCurveTo(x-150,ry+26,x-110,ry+20); c.lineTo(x+110,ry+20); c.quadraticCurveTo(x+150,ry+26,x+190,ry-8); c.lineTo(x+130,ry-46); c.lineTo(x-130,ry-46); c.closePath(); c.fill();
      c.fillStyle='#3a3a44'; c.fillRect(x-120,ry-60,240,16);
      c.fillStyle='#2f7d6a'; c.fillRect(x-150,ry+18,300,8); }
    c.fillStyle='#b8a88a'; c.fillRect(0,n-40,W,40); c.fillStyle='#3a3a44'; c.fillRect(0,n-48,W,10);
    break;
  case 'pyramid':
    for(const [x,s] of [[W*0.2,1],[W*0.55,1.4],[W*0.85,0.8]]){ const h=150*s, w=170*s;
      c.fillStyle='#e3b56a'; tri(c,x-w,f,x,f-h,x+w,f); c.fillStyle='#b98a45'; tri(c,x,f-h,x+w,f,x+w*0.25,f); }
    c.fillStyle='#d4a766'; c.fillRect(0,f,W,H);
    c.fillStyle='#c9a060'; c.fillRect(W*0.08,n-200,24,200); tri(c,W*0.08,n-200,W*0.08+12,n-224,W*0.08+24,n-200);
    break;
  case 'olympia':
    c.fillStyle='#8a9a6a'; hill(c,W*0.15,f,W*0.4,90); hill(c,W*0.7,f,W*0.45,70); c.fillRect(0,f,W,H);
    for(const x of [W*0.06,W*0.94]){ c.fillStyle='#5a4a32'; c.fillRect(x-4,n-60,8,60); c.fillStyle='#6f7f4a'; circ(c,x,n-72,30); circ(c,x-22,n-60,20); circ(c,x+22,n-60,20); }
    { const x=W*0.5, w=Math.min(W*0.62,520), top=n-230, col='#efe7d6';
      c.fillStyle='#d9cfba'; c.fillRect(x-w/2-20,n-22,w+40,22); c.fillRect(x-w/2-10,n-34,w+20,12);
      const cols=8, gap=w/(cols-1);
      for(let k=0;k<cols;k++){ const cx2=x-w/2+k*gap; c.fillStyle=col; c.fillRect(cx2-11,top+40,22,n-34-top-40);
        c.fillStyle='rgba(0,0,0,0.12)'; c.fillRect(cx2-4,top+40,2,n-34-top-40); c.fillRect(cx2+4,top+40,2,n-34-top-40);
        c.fillStyle='#e2d8c2'; c.fillRect(cx2-15,top+34,30,8); }
      c.fillStyle='#e2d8c2'; c.fillRect(x-w/2-20,top+10,w+40,26);
      c.fillStyle='rgba(0,0,0,0.12)'; for(let k=0;k<w+40;k+=18) c.fillRect(x-w/2-20+k,top+14,8,14);
      c.fillStyle=col; tri(c,x-w/2-26,top+10,x,top-50,x+w/2+26,top+10); }
    break;
  case 'colosseum':
    c.fillStyle='#4e5a3a';
    for(let i=0;i<9;i++){ const x=r()*W, h=90+r()*60; c.beginPath(); c.ellipse(x,f-h/2,12,h/2,0,0,TAU); c.fill(); }
    c.fillStyle='#a88f6a'; hill(c,W*0.5,f,W*0.7,60); c.fillRect(0,f,W,H);
    { const tiers=[[0,90],[90,80],[170,70]], left=-20, right=W+20;
      c.fillStyle='#c9a676'; c.beginPath(); c.moveTo(left,n); c.lineTo(left,n-240); for(let x=left;x<=W*0.35;x+=30) c.lineTo(x,n-240); c.lineTo(W*0.4,n-200); c.lineTo(W*0.5,n-215); c.lineTo(right,n-160); c.lineTo(right,n); c.closePath(); c.fill();
      c.fillStyle='#3a2a1c';
      for(const [y0,h] of tiers){ for(let x=left+14;x<right-20;x+=46){ const ybot=n-y0-12, ytop=ybot-h+26;
        const lim = x<W*0.35 ? n-240 : x<W*0.5 ? n-205 : n-165+ (x-W*0.5)*0;
        if(ytop<lim+10) continue;
        c.beginPath(); c.moveTo(x,ybot); c.lineTo(x,ytop+12); c.arc(x+13,ytop+12,13,Math.PI,TAU); c.lineTo(x+26,ybot); c.fill(); } }
      c.fillStyle='rgba(0,0,0,0.15)'; for(const [y0] of tiers) c.fillRect(left,n-y0-12,right-left,6); }
    break;
  case 'paris':
    c.fillStyle='#8a7f86';
    for(let i=0;i<16;i++){ const x=r()*W*1.1-W*0.05, w=50+r()*60, h=60+r()*60; c.fillRect(x,f-h,w,h+H); c.fillStyle='#5f5560'; c.beginPath(); c.moveTo(x-4,f-h); c.lineTo(x+8,f-h-22); c.lineTo(x+w-8,f-h-22); c.lineTo(x+w+4,f-h); c.fill(); c.fillStyle='#8a7f86'; }
    { const x=W*0.82, h=Math.min(420,H*0.7), base=n, col='#5a4636';
      c.strokeStyle=col; c.lineWidth=3;

function bottlePath(c){

  c.lineTo(-12,-48);

  c.lineTo(-29,63);
  c.quadraticCurveTo(-29,75,-17,75);
  c.lineTo(17,75);
  c.quadraticCurveTo(29,75,29,63);
  c.lineTo(29,-16);
  c.bezierCurveTo(29,-36,12,-34,12,-48);
  c.lineTo(12,-60);
  c.closePath();
}
function starPath(c,r,n){ c.beginPath(); for(let i=0;i<n*2;i++){ const rr=i%2?r*0.62:r, a=i*Math.PI/n-Math.PI/2; c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); } c.closePath(); }
function fitFont(c,txt,max,size,fam){ let f=size; c.font=`${f}px ${fam}`; while(c.measureText(txt).width>max && f>6){ f-=1; c.font=`${f}px ${fam}`; } return f; }
function jugPath(c){

}
function drawBottle(c, sk, x, y, ang, s, slosh=0){
  const P = sk.jug ? jugPath : bottlePath, FR = sk.jug ? 'evenodd' : 'nonzero';
  const NX = sk.jug ? -12 : 0, CAPW = sk.jug ? 11 : 13, RINGW = sk.jug ? 10 : 15, FY = sk.jug ? 6 : 0;
  const OUT='#141414', DISP='"Black Han Sans","Gothic A1",sans-serif';
  const inGame = (c===ctx);
  const flying = inGame && !!flight;
  c.save(); c.translate(x,y); c.rotate(ang); c.scale(s,s);
  const body = sk.rainbow ? `hsl(${(time*120)%360},95%,62%)` : sk.body;
  // flat body
  P(c); c.fillStyle=body; c.fill(FR);
  c.save(); P(c); c.clip(FR);
  if(sk.jug){ c.fillStyle='rgba(0,0,0,0.08)'; c.fillRect(18,-62,14,140); }
  if(sk.metal){ // cartoon metal: flat bands
    c.fillStyle='rgba(255,255,255,0.55)'; c.fillRect(-22,-62,7,140);
    c.fillStyle='rgba(0,0,0,0.18)'; c.fillRect(16,-62,14,140);
  }
  if(sk.peel){ // gold paint peeling off -> silver patches
    c.fillStyle='#c7ccd4';
    for(const [px,py,r] of [[-14,-6,7],[18,58,8],[-20,62,5],[10,-22,5]]){ c.beginPath(); for(let i=0;i<9;i++){ const a=i/9*TAU, rr=r*(0.7+0.3*((i*37)%5)/5); c.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr); } c.closePath(); c.fill(); c.strokeStyle=OUT; c.lineWidth=1; c.stroke(); }
  }
  // water, level with gravity, wobbly surface
  if(!sk.opaque && sk.water){
    c.save(); c.rotate(-ang);
    const e=75*Math.abs(Math.cos(ang))+29*Math.abs(Math.sin(ang));
    const lvl=e-2*e*0.36;
    c.rotate(slosh);
    c.fillStyle=sk.water; c.beginPath(); c.moveTo(-120,200);
    for(let wx=-120;wx<=120;wx+=6) c.lineTo(wx,lvl+Math.sin(wx*0.25+time*8)*1.8);
    c.lineTo(120,200); c.closePath(); c.fill();
    c.strokeStyle='rgba(255,255,255,0.8)'; c.lineWidth=1.5; c.beginPath();
    for(let wx=-120;wx<=120;wx+=6) c.lineTo(wx,lvl+Math.sin(wx*0.25+time*8)*1.8);
    c.stroke();
    c.restore();
  }
  if(sk.rainbow){ for(let i=0;i<8;i++){ c.fillStyle=`hsla(${(time*120+i*45)%360},100%,60%,0.55)`; c.fillRect(-30,-62+i*18,60,9); } }
  // cartoon highlight stripe
  c.fillStyle='rgba(255,255,255,0.7)'; c.beginPath(); c.roundRect ? c.roundRect(-23,-24,5,28,3) : c.rect(-23,-24,5,28); c.fill();
  c.beginPath(); c.arc(-20.5,10,2.5,0,TAU); c.fill();
  // crooked label (badly glued)
  c.save(); c.translate(0,26); c.rotate(-0.07);
  c.fillStyle=sk.label; c.fillRect(-32,-19,64,38);
  c.lineWidth=2.2; c.strokeStyle=OUT; c.strokeRect(-32,-19,64,38);
  // peeling corner
  c.fillStyle='#f4f0e6'; c.beginPath(); c.moveTo(32,-19); c.lineTo(22,-19); c.lineTo(32,-9); c.closePath(); c.fill(); c.stroke();
  c.fillStyle=sk.ink||'#fff'; c.textAlign='center'; c.textBaseline='middle';
  const lf=fitFont(c,sk.text,52,17,DISP);
  c.lineWidth=Math.max(1.5,lf*0.16); c.strokeStyle=OUT; c.lineJoin='round'; c.strokeText(sk.text,0,-3); c.fillText(sk.text,0,-3);
  c.font='900 6px "Gothic A1",sans-serif'; c.fillStyle=OUT; c.fillText('500mL(아마도)',0,12);
  c.restore();
  // gags
  if(sk.absinthe){ c.save(); c.translate(17,58); c.rotate(-0.5); c.fillStyle='#3fae1f'; c.strokeStyle='#141414'; c.lineWidth=1.2; c.beginPath(); c.ellipse(0,0,7,3,0,0,TAU); c.fill(); c.stroke(); c.beginPath(); c.moveTo(-7,0); c.lineTo(7,0); c.stroke(); c.restore(); }
  if(sk.tape){ c.save(); c.translate(4,62); c.rotate(0.35); c.fillStyle='rgba(190,190,180,0.92)'; c.fillRect(-26,-5,52,10); c.strokeStyle=OUT; c.lineWidth=1.2; c.strokeRect(-26,-5,52,10); c.restore(); }
  if(sk.dent){ c.strokeStyle=OUT; c.lineWidth=1.5; c.beginPath(); c.moveTo(12,58); c.quadraticCurveTo(20,62,14,68); c.moveTo(-18,-20); c.quadraticCurveTo(-12,-16,-18,-10); c.stroke(); }
  c.restore(); // end clip
  // thick wobbly-ish outline
  c.lineJoin='round'; c.lineWidth=3.2; c.strokeStyle=OUT; P(c); c.stroke();
  if(sk.hazard){ c.save(); c.translate(-18,58); c.rotate(Math.PI/4); c.fillStyle='#fff'; c.fillRect(-6,-6,12,12); c.lineWidth=1.6; c.strokeStyle='#e8141c'; c.strokeRect(-6,-6,12,12); c.restore(); c.fillStyle=OUT; c.font='900 9px "Gothic A1",sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText('!',-18,58.5); }
  if(sk.crack){ c.strokeStyle='rgba(255,255,255,0.95)'; c.lineWidth=1.4; c.beginPath(); c.moveTo(22,-20); c.lineTo(15,-10); c.lineTo(20,-4); c.lineTo(11,6); c.moveTo(15,-10); c.lineTo(9,-14); c.stroke(); }
  // googly eyes: pupils fall toward the real ground
  const jig = flying ? Math.sin(time*40)*1.3 : 0;
  const pdx=Math.sin(ang)*3.2+jig, pdy=Math.cos(ang)*3.2+(flying?Math.cos(time*33)*1.2:0);
  for(const ex of [-10,10]){
    c.fillStyle='#fff'; c.beginPath(); c.arc(ex,-16+FY,7.5,0,TAU); c.fill(); c.lineWidth=2; c.strokeStyle=OUT; c.stroke();
    c.fillStyle=OUT; c.beginPath(); c.arc(ex+pdx,-16+FY+pdy,3.6,0,TAU); c.fill();
  }

  c.strokeStyle=OUT; c.fillStyle=OUT; c.lineWidth=2;
  if(flying){ c.beginPath(); c.ellipse(0,-3+FY,3.5,4.5,0,0,TAU); c.fill(); }
  else { c.beginPath(); c.moveTo(-5,-5+FY); c.quadraticCurveTo(0,-1+FY,6,-6+FY); c.stroke(); }
  // neck ring + cap (flat, outlined)
  c.fillStyle='#ffffff'; c.fillRect(NX-RINGW,-63,RINGW*2,5); c.lineWidth=2; c.strokeStyle=OUT; c.strokeRect(NX-RINGW,-63,RINGW*2,5);

    c.textAlign='center'; c.textBaseline='middle';
    fitFont(c,sk.badge,br*1.3,9,DISP);
    if(['#e8141c','#ff4fa3'].includes(sk.badgeC)){ c.fillStyle='#fff'; c.lineWidth=2; c.strokeStyle=OUT; c.strokeText(sk.badge,0,1); } else c.fillStyle=OUT;

  }

    }
  }
  c.restore();
}

function draw(){
  if(!W||!H) return;
  const st=STG(), gy=groundY();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  const altBottom=(camAlt-(H-gy))/PX, altTop=(camAlt+gy)/PX, midAlt=(altBottom+altTop)/2;
  const g=ctx.createLinearGradient(0,H,0,0);
  for(let i=0;i<=6;i++){ const t=i/6; g.addColorStop(t, rgb(skyAt(st,altBottom+(altTop-altBottom)*t))); }
  ctx.fillStyle=g; ctx.fillRect(-20,-20,W+40,H+40);

  const starA = st.stars ? 1 : Math.min(1,Math.max(0,(midAlt-150)/250));
  if(starA>0){
    for(const s of STARS){
      const sy=(((s.y*H + camAlt*0.02*s.d)%H)+H)%H;
      ctx.globalAlpha=starA*(0.55+0.45*Math.sin(time*2+s.tw));
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x*W,sy,s.r,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  drawDeco(st);
  if(st.clouds){
    ctx.fillStyle=st.clouds;
    for(const cl of BGCLOUDS){
      const x=((cl.x+time*cl.v)%1+1)%1*(W+200)-100, y=cl.y*H+camAlt*0.1;
      if(y>H+60) continue;
      ctx.globalAlpha=0.7; ctx.beginPath(); ctx.ellipse(x,y,cl.s,cl.s*0.25,0,0,TAU); ctx.ellipse(x+cl.s*0.3,y-cl.s*0.15,cl.s*0.45,cl.s*0.25,0,0,TAU); ctx.fill();
    }
    for(const cl of CLOUDS){
      const y=scrY(cl.alt*PX); if(y<-80||y>H+80) continue;
      const x=((cl.x+time*cl.v)%1+1)%1*(W+300)-150;
      ctx.globalAlpha=0.85; ctx.beginPath();
      ctx.ellipse(x,y,cl.s,cl.s*0.28,0,0,TAU);
      ctx.ellipse(x-cl.s*0.4,y-cl.s*0.12,cl.s*0.45,cl.s*0.28,0,0,TAU);
      ctx.ellipse(x+cl.s*0.35,y-cl.s*0.18,cl.s*0.5,cl.s*0.32,0,0,TAU);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  drawProps(st);
  drawPlatform(st);

  // altitude ruler
  ctx.font='700 11px "Gothic A1", sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';
  const step=2, m0=Math.floor(altBottom/step)*step;
  for(let m=Math.max(step,m0); m<=altTop+step; m+=step){
    const y=scrY(m*PX);
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillRect(0,y,m%10===0?16:8,1.5);
    if(m%10===0 || altTop<20){ ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=3; ctx.strokeText(fmtM(m),20,y); ctx.fillText(fmtM(m),20,y); ctx.lineWidth=1; }
  }
  if(S.stats.maxH>0){
    const y=scrY(S.stats.maxH*PX+supportH(0));
    if(y>-10&&y<H){ ctx.strokeStyle='rgba(255,197,61,0.9)'; ctx.setLineDash([8,6]); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(W*0.62,y); ctx.lineTo(W,y); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth=1;
      ctx.fillStyle='#ffc53d'; ctx.textAlign='right'; ctx.fillText('최고 '+fmtM(S.stats.maxH),W-8,y-10); ctx.textAlign='left'; }
  }

  const cx=W/2, ty=scrY(0);
  if(ty<H+20){
    const sh=Math.max(0.15,1-bLift/(PX*8));
    ctx.fillStyle=`rgba(0,0,0,${0.3*sh})`; ctx.beginPath(); ctx.ellipse(cx,ty+2,34*SC*sh,7*sh,0,0,TAU); ctx.fill();
  }
  const ang=drawAng(), by=scrY(bLift+supportH(ang));
  if(golden){
    const rg=ctx.createRadialGradient(cx,by,10,cx,by,170);
    rg.addColorStop(0,'rgba(255,205,70,0.55)'); rg.addColorStop(1,'rgba(255,205,70,0)');
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,by,170,0,TAU); ctx.fill();
  }
  if(flight){
    const v=Math.abs(flight.peak*4*(1-2*Math.min(1,flight.t)))/flight.dur;
    if(v>600){
      ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=2;
      for(let i=0;i<8;i++){ const lx=cx+(i-3.5)*24, len=Math.min(160,v/40); const ly=by+(flight.t<0.5?60:-60-len)+((i*37)%40);
        ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly+len); ctx.stroke(); }
      ctx.lineWidth=1;
    }
  }
  const slosh = wob ? -wob.a*0.8*Math.exp(-5*wob.t)*Math.sin(22*wob.t) : 0;
  drawBottle(ctx, skinOf(S.skin), cx, by, ang, SC, slosh);
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color; circ(ctx,p.x,p.y,p.r); }
  ctx.globalAlpha=1;
  drawAmbient(st);
  if(feverLeft>0){
    const a=0.2+0.08*Math.sin(time*12);
    const fg=ctx.createLinearGradient(0,H,0,H*0.4); fg.addColorStop(0,`rgba(255,77,46,${a+0.15})`); fg.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=fg; ctx.fillRect(-20,-20,W+40,H+40);
  }
  ctx.restore();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,t.life/0.4); ctx.font=`${t.size}px "Black Han Sans", sans-serif`;
    ctx.save(); ctx.translate(t.x,t.y); if(t.rot) ctx.rotate(t.rot);
    ctx.lineWidth=6; ctx.strokeStyle='rgba(5,10,25,0.85)'; ctx.strokeText(t.text,0,0);
    ctx.fillStyle=t.color; ctx.fillText(t.text,0,0); ctx.restore();
  }
  ctx.globalAlpha=1; ctx.textAlign='start'; ctx.lineWidth=1;
}

function addText(text,color,size,dy=0,life=1.3,vy=-60,dx=0){ texts.push({text,color,size,x:W/2+dx,y:groundY()-BH*SC-50+dy,life,vy}); }
function sideText(text,color,size){
  // 물병이 떨어진 자리(화면 가운데 바닥) 주변 랜덤 위치
  const side=Math.random()<0.5?-1:1;
  const maxDx=Math.min(W*0.32,230), minDx=Math.min(70,maxDx*0.5);
  const dx=side*(minDx+Math.random()*(maxDx-minDx));
  const bh=BH*SC;
  const y=groundY()-bh*(0.15+Math.random()*0.9);
  const rot=(Math.random()-0.5)*0.5;
  texts.push({text,color,size,x:W/2+dx,y,life:1.4,vy:-25,rot});
}
function burst(n,colorFn,speed){
  const x=W/2, y=groundY()-8;
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+(Math.random()-0.5)*2.2, v=speed*(0.5+Math.random());
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:4+Math.random()*4,color:colorFn(i),life:1,max:1});
  }
}

// ---------- gameplay ----------
function ready(){ return !flight && !settle && cdLeft<=0 && !modalOpen; }

function doThrow(auto){
  if(!ready()) return;
  let res;
  if(auto===true){
    const p=SKL('robot').p[skLv('robot')-1];
    res = Math.random()<p ? 'ok' : 'fail';
  } else {
    const p=needle;
    if(zones.jp && p>=zones.jp[0]-0.002 && p<=zones.jp[1]+0.002) res='jack';
    else if(p>=zones.rv[0] && p<=zones.rv[1]) res='rev';
    else if(p>=zones.pf[0] && p<=zones.pf[1]) res='perfect';
    else if(p>=zones.ok[0] && p<=zones.ok[1]) res='ok';
    else res='fail';
  }
  let saved=false;
  if(res==='fail' && skLv('second') && Math.random()<SKL('second').p[skLv('second')-1]){ res='ok'; saved=true; }
  const cd=cooldown(); cdLeft=cdTotal=cd;
  const gv=STG().grav||1;
  const pm=peakM(S.lv.power)/gv*(res==='fail'?0.8+Math.random()*0.35:1);
  let dur=(0.55+0.28*Math.log10(1+pm))/Math.sqrt(gv);
  if(feverLeft>0) dur=Math.max(0.28,dur*0.45);
  const start=((bAng%TAU)+TAU)%TAU; bAng=start; wob=null;
  const n=1+Math.floor(Math.log2(1+pm));
  const tilt=Math.random()<0.5?-1:1;
  const desired = res==='rev' ? Math.PI : res==='fail' ? tilt*0.55 : 0;
  let target=start+TAU*n; target += (((desired-target)%TAU)+TAU)%TAU;
  flight={t:0,dur,start,target,res,peak:pm*PX,tilt,pm,saved,auto:auto===true}; lastPeak=0;
  sfx.throw();
}

function land(f){
  landSound(STG().surf, Math.min(1,0.45+Math.log10(1+f.pm)/3.5));
  if(f.res==='fail') settle={t:0,dur:0.26,from:bAng,to:bAng+f.tilt*(Math.PI/2-0.55)};
  else wob={t:0,a:f.saved?0.3:f.res==='jack'?0.03:f.res==='perfect'?0.05:f.res==='rev'?0.08:0.14*(Math.random()<0.5?-1:1)};
  if(f.saved) addText('두 번째 기회','#b8ffb0',24,-104);
  resolve(f.res, f.auto);
}

function resolve(res, auto){
  S.stats.flips++;
  if(res==='fail'){
    if(skLv('guard') && guardCd<=0 && combo>0){
      guardCd=SKL('guard').cd[skLv('guard')-1]; addText('콤보 보호','#9fe0ff',24,44);
    } else {
      if(combo>=5) addText(combo+' 콤보 끊김','#ffb3b3',22,44);
      combo=0;
    }
    addText('실패','#ff8a8a',38); sideText('이걸 못세우네','#ffb3a8',28); sfx.fail(); shake=5;
    burst(10,()=> 'rgba(170,170,170,0.8)',140);
  } else {
    combo++; S.stats.ok++;
    if(combo>S.stats.best) S.stats.best=combo;
    let gain=goldFor(combo);
    if(res==='perfect'){ gain*=1.5; S.stats.perfect++; }
    if(res==='rev'){ gain*=10; S.stats.rev++; }
    if(res==='jack'){ gain*=100; S.stats.jack++; }
    if(golden) gain*=5;
    if(auto) gain*=0.7;
    S.gold+=gain; S.stats.earned+=gain;
    goldBox.classList.remove('bump'); void goldBox.offsetWidth; goldBox.classList.add('bump');
    if(res==='jack') sideText('토토!','#ff5a4a',46); else if(Math.random()<0.1) sideText('뽀록','#ffe27a',34);
    if(res==='jack'){ addText('잭팟 ×100','#ff5a4a',56,-50,2); sfx.jack(); shake=18; burst(90,i=>i%2?'#ff3b2b':'#ffd84a',620); }
    else if(res==='rev'){ addText('거꾸로 세우기 ×10','#ffd84a',38,-40); sfx.rev(); shake=10; burst(50,i=>i%3?'#ffc83d':'#fff1b8',480); }
    else if(res==='perfect'){ addText('퍼펙트','#a8ffd0',36,-40); sfx.perfect(); burst(24,()=> '#ffc83d',360); }
    else { sfx.ok(); burst(14,()=> '#ffc83d',280); }
    if(golden) addText('황금 찬스 ×5','#ffe27a',26,-80);
    addText('+'+fmt(gain)+' G','#ffffff',res==='jack'?52:res==='rev'?44:36);
    const basePts = res==='jack'?150:res==='rev'?30:res==='perfect'?10:5;
    const pts = basePts*(skLv('collect')?SKL('collect').m[skLv('collect')-1]:1)*(auto?0.7:1);
    S.pts += pts; addText('+'+(pts%1?pts.toFixed(1):pts)+' pt','#5fd3ff',22,44);
    if(feverLeft<=0 && feverLock<=0){
      S.fever += (res==='jack'?80:res==='rev'?40:res==='perfect'?18:12)*feverFill(S.lv.ffill)*(auto?0.5:1);
      if(S.fever>=100) startFever();
    }
  }
  if(goldenCharges>0){ golden=true; goldenCharges--; } else golden = Math.random()<0.05;
  newZones(); refreshRecords();
}

function startFever(){
  S.fever=100; feverTotal=feverLeft=feverDur(S.lv.ftime); S.stats.fevers++;
  sfx.fever(); shake=10; addText('FEVER TIME','#ffb35a',44,-120);
}

// ---------- skills ----------
function useSkill(k){
  const sk=SKL(k), l=skLv(k); if(!l || modalOpen) return;
  if(sk.type==='toggle'){ S.robotOn=!S.robotOn; save(); buildSkillBar(); return; }
  if((skCd[k]||0)>0) return;
  if(k==='ignite' && feverLeft>0) return;
  skCd[k]=sk.cd[l-1];
  if(k==='slow'){ skAct.slow=sk.dur[l-1]; }
  if(k==='wide'){ skAct.wide=sk.dur[l-1]; if(!flight) newZones(); }
  if(k==='midas'){ golden=true; goldenCharges=sk.n[l-1]-1; }
  if(k==='ignite'){ startFever(); }
  texts.push({text:sk.name,color:'#5fd3ff',size:28,x:W/2,y:H*0.22,life:1.2,vy:-20});
  beep(740,.12,'triangle',.06); beep(1100,.14,'triangle',.05,.06);
}
const sbEls={};
function buildSkillBar(){
  const bar=$('skillbar'); bar.innerHTML='';
  for(const sk of SKILLS){
    if(sk.type==='passive' || !skLv(sk.k)) continue;
    const b=document.createElement('button'); b.className='sbar btn';
    b.innerHTML=`<div class="skic">${SKICON[sk.k]||''}</div><div class="sbt"><b>${sk.name}</b><span>${sk.type==='toggle'?(S.robotOn?'켜짐':'꺼짐')+' · '+sk.key+' 키':sk.key+' 키'}</span></div><i></i>`;
    b.addEventListener('click',()=>useSkill(sk.k));
    bar.appendChild(b); sbEls[sk.k]={b,i:b.querySelector('i'),s:b.querySelector('span')};
  }
}
function updateSkillBar(){
  for(const k in sbEls){
    const e=sbEls[k], sk=SKL(k); if(!e.b.isConnected) continue;
    if(sk.type==='toggle'){ e.b.classList.toggle('on',!!S.robotOn); continue; }
    const cd=skCd[k]||0, act=(skAct[k]||0)>0 || (k==='midas'&&(goldenCharges>0)) || (k==='ignite'&&feverLeft>0&&cd>0&&cd>sk.cd[skLv(k)-1]-feverTotal);
    e.b.classList.toggle('act',act);
    e.b.disabled = cd>0 && !act;
    e.i.style.transform=`scaleX(${cd>0?cd/sk.cd[skLv(k)-1]:0})`;
    e.s.textContent = cd>0 ? `${Math.ceil(cd)}초 · ${sk.key} 키` : `사용 가능 · ${sk.key} 키`;
  }
}

// ---------- stages ----------
function setStage(i,silent){
  if(i<0||i>=STAGES.length||i>S.unlocked) return;
  S.stage=i; feverLeft=0; S.fever=Math.min(S.fever,99); combo=0; bAng=0; settle=null; wob=null;
  newZones(); refreshStageUI(); save();
  if(silent) return;
  const st=STG();
  texts.push({text:st.code+'  '+st.name,color:'#ffffff',size:38,x:W/2,y:H*0.34,life:2.2,vy:0});
  if(st.year) texts.push({text:st.year,color:'#ffc83d',size:22,x:W/2,y:H*0.34+42,life:2.2,vy:0});
  if(st.grav) texts.push({text:'저중력 · 높이 ×'+(1/st.grav).toFixed(1),color:'#5fd3ff',size:20,x:W/2,y:H*0.34+(st.year?76:42),life:2.2,vy:0});
}
function nextTarget(){ return S.unlocked+1; } // index of next thing to buy (20 = final)
function buyNext(){
  const t=nextTarget(); if(t>STAGES.length || (t===STAGES.length && S.champion)) return;
  const c=unlockCost(t); if(S.gold<c) return;
  S.gold-=c; sfx.clear();
  if(t===STAGES.length){ S.champion=true; save(); showEnding(); return; }
  S.unlocked=t; save(); showStory(t);
}

const fmtMult = m => m<10 ? m.toFixed(2) : m<100 ? m.toFixed(1) : fmt(m);
function refreshStageUI(){
  const st=STG();
  $('spCode').textContent=st.code;
  $('spName').textContent=st.name;
  $('spYear').textContent=st.year||('CH.'+st.ch+' '+CHAPTERS[st.ch].name);
  $('spMult').textContent=`골드 ×${fmtMult(stageMult(st.i))}${st.grav?' · 저중력':''}`;
  const t=nextTarget(), btn=$('nextBtn');
  if(t>STAGES.length || (t===STAGES.length && S.champion)){
    btn.disabled=true; $('nextLabel').textContent='🏆 챔피언'; $('nextCost').textContent='모든 대회 우승';
    $('spFill').style.width='100%'; $('spSub').textContent='전 시대 통합 챔피언 · 눌러서 무대 이동';
  } else {
    const c=unlockCost(t), final=t===STAGES.length;
    $('nextLabel').textContent = final ? '🏆 최종 결승' : '다음 무대 ▶';
    $('nextCost').textContent = fmt(c)+' G';
    btn.disabled = S.gold<c;
    $('spFill').style.width=Math.min(100,S.gold/c*100)+'%';
    $('spSub').textContent = final ? `최종 결승 참가비 ${fmt(S.gold)} / ${fmt(c)} G` : `다음: ${STAGES[t].code} ${STAGES[t].name} · ${fmt(S.gold)} / ${fmt(c)} G`;
  }
}

function openModal(html,primary){
  mcard.innerHTML=html; modal.hidden=false; modalOpen=true; modalPrimary=primary||null;
  const b=mcard.querySelector('.mbtn.primary'); if(b) setTimeout(()=>b.focus(),50);
}
function closeModal(){ modal.hidden=true; modalOpen=false; modalPrimary=null; }

let typeTimer=null;
function typeText(el,txt){
  clearInterval(typeTimer); let k=0;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent=txt; return; }
  typeTimer=setInterval(()=>{ k+=2; el.textContent=txt.slice(0,k); if(k>=txt.length) clearInterval(typeTimer); },28);
  el.onclick=()=>{ clearInterval(typeTimer); el.textContent=txt; };
}

function showStory(i){
  const st=STAGES[i], newCh = i===0 || STAGES[i-1].ch!==st.ch;
  openModal(`<div class="m-band"><span class="a disp">${i===0?'프롤로그':'스포츠 속보'}</span><span class="b">${newCh?`CHAPTER ${st.ch} ${CHAPTERS[st.ch].name} · `:''}${st.code}${st.year?' · '+st.year:''}</span></div>
    <div class="m-body"><div class="m-title disp">${st.name}</div>
    <p class="m-story" id="mStory"></p>
    <div class="m-meta">이 무대의 골드 배율 <b>×${fmtMult(stageMult(i))}</b>${st.grav?` · 저중력 높이 ×${(1/st.grav).toFixed(1)}`:''}</div>
    <div class="m-btns"><button class="btn mbtn primary disp" id="mGo">${i===0?'물병 들기':'경기 시작'}</button></div></div>`, go);
  typeText($('mStory'), STORY[i]);
  function go(){ if(i===0){ S.introSeen=true; } closeModal(); setStage(i); refreshRecords(); }
  $('mGo').onclick=go;
}
function showEnding(){
  openModal(`<div class="m-band"><span class="a disp">호외</span><span class="b">최종 결승 · 엔딩</span></div>
    <div class="m-body"><div class="m-title disp">모든 시대의 챔피언</div>
    <p class="m-story" id="mStory"></p>
    <div class="m-meta">이제 모든 무대를 자유롭게 오가며 기록을 늘려 보세요.</div>
    <div class="m-btns"><button class="btn mbtn primary disp" id="mGo">계속 플레이</button></div></div>`, go);
  typeText($('mStory'), ENDING);
  function go(){ closeModal(); refreshStageUI(); refreshRecords(); }
  $('mGo').onclick=go;
}

function showMap(){
  const t=nextTarget();
  let html=`<div class="m-band"><span class="a disp">대회 일정</span><span class="b">열린 무대 ${Math.min(S.unlocked+1,STAGES.length)} / ${STAGES.length}</span></div><div class="m-body"><div class="m-title disp">어느 대회에 나갈까요?</div>`;
  for(const ch of [1,2,3,4]){
    html+=`<div class="chap"><h3 class="disp">CH.${ch} ${CHAPTERS[ch].name}</h3><p>${CHAPTERS[ch].sub}</p><div class="sgrid">`;
    for(const st of STAGES.filter(s=>s.ch===ch)){
      const open=st.i<=S.unlocked, buyable=st.i===t, cur=st.i===S.stage;
      const label = open ? st.name : buyable ? fmt(unlockCost(st.i))+' G' : '잠김';
      html+=`<button class="sbtn ${open&&!cur?'done':''} ${cur?'cur':''} ${buyable?'buyable':''}" data-i="${st.i}" ${!open&&!(buyable&&S.gold>=unlockCost(st.i))?'disabled':''}>
        <b>${open?st.code:buyable?'🔓 '+st.code:'🔒'}</b><span>${label}</span><span>${open||buyable?(st.year?st.year:'×'+fmtMult(stageMult(st.i))):''}</span></button>`;
    }
    html+=`</div></div>`;
  }
  if(t===STAGES.length && !S.champion) html+=`<div class="m-meta">🏆 최종 결승 참가비 <b>${fmt(unlockCost(t))} G</b> · 위쪽 버튼으로 도전할 수 있어요.</div>`;
  html+=`<div class="m-btns"><button class="btn mbtn primary disp" id="mClose">닫기</button></div></div>`;
  openModal(html, closeModal);
  mcard.querySelectorAll('.sbtn').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i;
    if(i<=S.unlocked){ closeModal(); if(i!==S.stage) setStage(i); }
    else if(i===t){ closeModal(); buyNext(); }
  }));
  $('mClose').onclick=closeModal;
}

// ---------- side panes ----------
const upList=$('upList'), skinList=$('skinList'), skillList=$('skillList');
const upEls={}, skillEls={};
function buildShop(){
  upList.innerHTML='';
  for(const u of UPGS){
    const d=document.createElement('div'); d.className='up';
    d.innerHTML=`<div class="ic">${u.ic}</div><div><div class="nm">${u.name}<em></em></div><div class="ef"></div></div><button class="buy"></button>`;
    const btn=d.querySelector('button'); btn.addEventListener('click',()=>buyUp(u));
    upList.appendChild(d);
    upEls[u.k]={lv:d.querySelector('em'),ef:d.querySelector('.ef'),btn};
  }
  skinList.innerHTML='';
  for(const s of SKINS){
    const d=document.createElement('div'); d.className='up sk';
    d.innerHTML=`<canvas width="72" height="144"></canvas><div><div class="nm">${s.name}</div><div class="ef">골드 ×${s.mult}</div></div><button class="buy"></button>`;
    const btn=d.querySelector('button'); btn.addEventListener('click',()=>skinAction(s));
    skinList.appendChild(d);
    s._cv=d.querySelector('canvas'); s._btn=btn;
  }
  skillList.innerHTML='';
  for(const sk of SKILLS){
    const d=document.createElement('div'); d.className='up skl';
    d.innerHTML=`<div class="skic">${SKICON[sk.k]||''}</div><div><div class="nm">${sk.name}<em></em></div><div class="ef"></div></div><button class="buy pt"></button>`;
    const btn=d.querySelector('button'); btn.addEventListener('click',()=>buySkill(sk));
    skillList.appendChild(d);
    skillEls[sk.k]={lv:d.querySelector('em'),ef:d.querySelector('.ef'),btn};
  }
  refreshShop();
}
function refreshShop(){
  for(const u of UPGS){
    const e=upEls[u.k], l=S.lv[u.k], max=l>=u.max;
    e.lv.textContent='Lv.'+l+(max?' MAX':'');
    e.ef.textContent = max ? u.eff(l) : u.eff(l)+' → '+u.eff(l+1);
    if(max){ e.btn.textContent='MAX'; e.btn.disabled=true; }
    else { const c=costOf(u); e.btn.textContent=fmt(c)+' G'; e.btn.disabled=S.gold<c; }
  }
  for(const s of SKINS){
    const own=S.owned.includes(s.id), b=s._btn;
    b.className='buy';
    if(S.skin===s.id){ b.textContent='사용 중'; b.classList.add('using'); b.disabled=false; }
    else if(own){ b.textContent='장착'; b.classList.add('eq'); b.disabled=false; }
    else { b.textContent=fmt(s.cost)+' G'; b.disabled=S.gold<s.cost; }
  }
  for(const sk of SKILLS){
    const e=skillEls[sk.k], l=skLv(sk.k), max=l>=3;
    const tag = sk.type==='passive'?'패시브':sk.type==='toggle'?'자동':'액티브';
    e.lv.textContent = (l?'Lv.'+l:'미습득')+' · '+tag;
    e.ef.textContent = l ? (max? sk.desc(l) : sk.desc(l)+' → Lv.'+(l+1)) : sk.desc(1);
    if(max){ e.btn.textContent='MAX'; e.btn.disabled=true; }
    else { const c=sk.cost[l]; e.btn.textContent=c+' pt'; e.btn.disabled=S.pts<c; }
  }
}
function drawSkinPreviews(){
  for(const s of SKINS){
    const c=s._cv.getContext('2d'); c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,72,144);
    drawBottle(c,s,36,72,0,0.88);
  }
}
function buyUp(u){
  if(S.lv[u.k]>=u.max) return;
  const c=costOf(u); if(S.gold<c) return;
  S.gold-=c; S.lv[u.k]++; sfx.buy(); refreshShop(); save();
}
function skinAction(s){
  if(S.skin===s.id) return;
  if(!S.owned.includes(s.id)){ if(S.gold<s.cost) return; S.gold-=s.cost; S.owned.push(s.id); sfx.buy(); }
  S.skin=s.id; refreshShop(); save();
}
function buySkill(sk){
  const l=skLv(sk.k); if(l>=3) return;
  const c=sk.cost[l]; if(S.pts<c) return;
  S.pts-=c; S.sk[sk.k]=l+1; sfx.buy(); refreshShop(); buildSkillBar(); save();
}

function refreshRecords(){
  const st=S.stats, rate=st.flips?Math.round(st.ok/st.flips*100):0;
  $('recBox').innerHTML=[
    ['열린 무대',Math.min(S.unlocked+1,STAGES.length)+' / '+STAGES.length+(S.champion?' 🏆':'')],
    ['총 던진 횟수',fmt(st.flips)],['성공률',rate+'%'],['퍼펙트',fmt(st.perfect)],['거꾸로 세우기',fmt(st.rev)],
    ['잭팟 ×100',fmt(st.jack)],['최고 콤보',st.best],['도박 승 / 패',st.gWin+' / '+st.gLose],['도박 손익',(st.gNet<0?'-':'+')+fmt(Math.abs(st.gNet))+' G'],['최고 높이',fmtM(st.maxH)],['피버 발동',fmt(st.fevers)],['누적 골드',fmt(st.earned)+' G'],

$('soundIc').textContent=S.sound?'🔊':'🔇';

// ---------- gambling ----------
function parseAmt(v){
  v=String(v||'').trim().toUpperCase().replace(/,/g,'').replace(/G$/,'').trim();
  const m=v.match(/^([0-9.]+) *(K|M|B|T|QA|QI)?$/); if(!m) return 0;
  const mul={K:1e3,M:1e6,B:1e9,T:1e12,QA:1e15,QI:1e18}[m[2]]||1;
  return Math.floor(Math.round(parseFloat(m[1])*mul*1000)/1000)||0;
}
let coinRot=0, flipping=false;
const dMax = () => Math.floor(S.gold/3);
function gambleRecord(bet,win){ if(win){ S.stats.gWin++; S.stats.gNet+=bet; } else { S.stats.gLose++; S.stats.gNet-=bet; } refreshRecords(); save(); }
$('doubleOpen').addEventListener('click',()=>{ if(!modalOpen) showDouble(); });
function showDouble(){
  openModal(`<div class="m-band"><span class="a disp">묻고 더블로 가</span><span class="b">앞면이면 2배, 뒷면이면 0배</span></div>
    <div class="m-body">
      <div class="coinstage"><div class="coin3d" aria-hidden="true"><div class="in" id="coinIn"><div class="f h">×2</div><div class="f t">×0</div></div></div></div>
      <div class="gbox">
        <div class="g-row"><input id="betAmt" type="text" inputmode="decimal" placeholder="걸 금액 (예: 1.5K)" aria-label="걸 금액"></div>
        <div class="g-quick"><button class="btn" data-p="0.1">10%</button><button class="btn" data-p="0.2">20%</button><button class="btn" data-p="max">최대 ⅓</button></div>
        <div class="m-meta" style="margin-top:8px" id="gMax"></div>
      </div>
      <div class="g-res" id="gRes">가진 돈의 ⅓까지만 걸 수 있어요.</div>
      <div class="m-btns"><button class="btn mbtn primary disp" id="doubleBtn">묻고 더블로 가!</button><button class="btn mbtn disp" id="dClose">나가기</button></div>
    </div>`, null);
  const betEl=$('betAmt'), coinIn=$('coinIn'), gRes=$('gRes'), doubleBtn=$('doubleBtn');
  coinIn.style.transition='none'; coinIn.style.transform=`rotateY(${coinRot}deg)`; void coinIn.offsetWidth; coinIn.style.transition='';
  const upd=()=>{ const g=$('gMax'); if(g) g.innerHTML=`보유 <b>${fmt(S.gold)} G</b> · 최대 <b>${fmt(dMax())} G</b>`; };
  upd();
  mcard.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{
    const v = b.dataset.p==='max' ? dMax() : Math.floor(S.gold*parseFloat(b.dataset.p)); betEl.value=fmt(v);
  }));
  $('dClose').onclick=()=>{ if(!flipping) closeModal(); };
  doubleBtn.onclick=()=>{
    if(flipping) return;
    let bet=parseAmt(betEl.value);
    if(bet<=0){ gRes.className='g-res lose'; gRes.textContent='걸 금액을 입력하세요.'; return; }
    if(bet>dMax()*1.01){ gRes.className='g-res lose'; gRes.textContent=`가진 돈의 ⅓까지만 걸 수 있어요 (최대 ${fmt(dMax())} G)`; return; }
    bet=Math.min(bet,dMax()); if(bet<=0) return;
    flipping=true; doubleBtn.disabled=true; S.gold-=bet; sfx.coin(); upd();
    const win=Math.random()<0.5;
    coinRot += 1800 + (win ? (coinRot%360===0?0:180) : (coinRot%360===0?180:0));
    coinIn.style.transform=`rotateY(${coinRot}deg)`;
    gRes.className='g-res'; gRes.textContent=`${fmt(bet)} G 걸고 동전 던지는 중…`;
    setTimeout(()=>{
      if(win){ S.gold+=bet*2; gRes.className='g-res win'; gRes.textContent=`앞면! ${fmt(bet*2)} G 획득 (+${fmt(bet)})`; sfx.win(); }
      else { gRes.className='g-res lose'; gRes.textContent=`뒷면… ${fmt(bet)} G 날아감`; sfx.lose(); }
      gambleRecord(bet,win); flipping=false; doubleBtn.disabled=false; upd();
    },1250);
  };
}

$('yabBtn').addEventListener('click',()=>{ if(!modalOpen) showYabawi(); });
function showYabawi(){
  openModal(`<div class="m-band"><span class="a disp">야바위</span><span class="b">컵 3개 중 공이 든 컵을 맞히면 2배</span></div>
    <div class="m-body">
      <div class="cups" id="cups"><div class="table"></div><div class="ball" id="yBall"></div>
        <button class="cup" data-c="0" aria-label="왼쪽 컵"></button><button class="cup" data-c="1" aria-label="가운데 컵"></button><button class="cup" data-c="2" aria-label="오른쪽 컵"></button></div>
      <div class="m-meta" id="yMsg" style="text-align:center;font-size:15px">걸 금액을 정하고 섞기를 누르세요. 가진 돈 전부 걸어도 돼요.</div>
      <div class="gbox" style="margin-top:10px">
        <div class="g-row"><input id="yBet" type="text" inputmode="decimal" placeholder="걸 금액 (예: 20K)" aria-label="야바위 걸 금액"></div>
        <div class="g-quick"><button class="btn" data-y="0.25">25%</button><button class="btn" data-y="0.5">50%</button><button class="btn" data-y="1">전부</button></div>
      </div>
      <div class="m-btns"><button class="btn mbtn primary disp" id="yGo">걸고 섞기</button><button class="btn mbtn disp" id="yClose">나가기</button></div>
    </div>`, null);
  const cupsEl=$('cups'), ball=$('yBall'), msg=$('yMsg'), go=$('yGo'), yBet=$('yBet');
  const cups=[...cupsEl.querySelectorAll('.cup')];
  const W0=cupsEl.clientWidth||340, gap=(W0-3*86)/4, leftAt=p=>gap+p*(86+gap);
  let pos=[0,1,2], state='bet', bet=0, ballCup=1;
  const place=()=>cups.forEach((c,i)=>c.style.left=leftAt(pos[i])+'px');
  place();
  ball.style.left=(leftAt(1)+30)+'px'; ball.classList.add('show'); cups[1].classList.add('up');
  setTimeout(()=>cups[1].classList.remove('up'),700);
  mcard.querySelectorAll('[data-y]').forEach(b=>b.addEventListener('click',()=>{ yBet.value=fmt(Math.floor(S.gold*parseFloat(b.dataset.y))); }));
  $('yClose').onclick=()=>{ if(state==='shuffle') return; closeModal(); };
  go.onclick=()=>{
    if(state==='done'){ // reset for another round
      cups.forEach(c=>c.classList.remove('up')); ball.classList.remove('show'); state='bet'; go.textContent='걸고 섞기'; msg.textContent='걸 금액을 정하고 섞기를 누르세요.'; msg.style.color=''; return;
    }
    if(state!=='bet') return;
    bet=parseAmt(yBet.value);
    if(bet<=0){ msg.textContent='걸 금액을 입력하세요.'; return; }
    if(bet>S.gold*1.01){ msg.textContent=`가진 골드(${fmt(S.gold)} G)보다 많이 걸 수 없어요.`; return; }
    bet=Math.min(bet,Math.floor(S.gold)); if(bet<=0) return;
    S.gold-=bet; state='shuffle'; go.disabled=true; ball.classList.remove('show');
    msg.textContent=`${fmt(bet)} G 걸었다! 섞는 중…`; msg.style.color='';
    let n=0;
    const step=()=>{
      if(n++>=12){ state='pick'; cupsEl.classList.add('pick'); msg.textContent='공이 들어 있는 컵을 고르세요!'; return; }
      const a=Math.floor(Math.random()*3); let b=(a+1+Math.floor(Math.random()*2))%3;
      const ia=pos.indexOf(a), ib=pos.indexOf(b); pos[ia]=b; pos[ib]=a; place(); beep(300+Math.random()*200,.05,'triangle',.03);
      setTimeout(step,200);
    };
    setTimeout(step,250);
  };
  cups.forEach((c,i)=>c.addEventListener('click',()=>{
    if(state!=='pick') return;
    state='done'; cupsEl.classList.remove('pick');
    const win=Math.random()<1/3;
    ballCup = win ? i : [0,1,2].filter(x=>x!==i)[Math.floor(Math.random()*2)];
    ball.style.left=(leftAt(pos[ballCup])+30)+'px'; ball.classList.add('show');
    c.classList.add('up'); setTimeout(()=>cups.forEach(x=>x.classList.add('up')),450);
    if(win){ S.gold+=bet*2; msg.textContent=`찾았다! ${fmt(bet*2)} G 획득 (+${fmt(bet)})`; msg.style.color='var(--gold)'; sfx.win(); }
    else { msg.textContent=`꽝! ${fmt(bet)} G를 잃었어요.`; msg.style.color='#ff6b5f'; sfx.lose(); }
    gambleRecord(bet,win);
    go.disabled=false; go.textContent='한 판 더';
  }));
}

// ---------- loop ----------
let last=performance.now(), shopTick=0, prevTick=0, saveTick=0;
const buffsEl=$('buffs');
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; time+=dt;

  for(const k in skCd) if(skCd[k]>0) skCd[k]=Math.max(0,skCd[k]-dt);
  for(const k in skAct) if(skAct[k]>0){ skAct[k]=Math.max(0,skAct[k]-dt); if(k==='wide'&&skAct[k]===0&&!flight) newZones(); }
  if(guardCd>0) guardCd=Math.max(0,guardCd-dt);
  if(feverLock>0) feverLock=Math.max(0,feverLock-dt);

  const spd=(0.85+S.stage*0.015+Math.min(combo,40)*0.02)*((skAct.slow||0)>0?0.5:1);
  needle+=nDir*spd*dt;
  if(needle>1){needle=2-needle;nDir=-1} if(needle<0){needle=-needle;nDir=1}
  if(cdLeft>0) cdLeft=Math.max(0,cdLeft-dt);

  if(robotT>0) robotT-=dt;
  if(S.robotOn && skLv('robot') && ready() && robotT<=0){ doThrow(true); robotT=SKL('robot').iv[skLv('robot')-1]; }

  if(flight){
    flight.t+=dt/flight.dur; const t=Math.min(1,flight.t), e=1-Math.pow(1-t,2.2);
    bAng=flight.start+(flight.target-flight.start)*e;
    bLift=flight.peak*4*t*(1-t);
    const hm=bLift/PX;
    if(hm>lastPeak) lastPeak=hm;
    if(hm>S.stats.maxH) S.stats.maxH=hm;
    if(!S.stats.space && hm>=400){ S.stats.space=true; sfx.space(); texts.push({text:'🚀 우주 도달!',color:'#5fd3ff',size:44,x:W/2,y:H*0.3,life:2,vy:0}); }
    if(t>=1){ bLift=0; bAng=flight.target; const f=flight; flight=null; land(f); }
  } else if(settle){
    settle.t+=dt/settle.dur; const t=Math.min(1,settle.t);
    bAng=settle.from+(settle.to-settle.from)*t*t;
    if(t>=1){ bAng=settle.to; settle=null; landSound(STG().surf,0.4); }
  }
  if(wob){ wob.t+=dt; if(wob.t>0.8) wob=null; }

  if(feverLeft>0){
    feverLeft-=dt; S.fever=Math.max(0,100*feverLeft/feverTotal);
    if(feverLeft<=0){ feverLeft=0; S.fever=0; feverLock=3; }
  }

  camAlt=Math.max(0, bLift+BH*SC - groundY()*0.5);
  if(shake>0) shake=Math.max(0,shake-dt*30);

  for(const p of particles){ p.vy+=900*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);
  for(const t of texts){ t.y+=t.vy*dt; t.vy*=0.96; t.life-=dt; }
  texts=texts.filter(t=>t.life>0);

  draw();

  goldEl.textContent=fmt(S.gold);
  $('ptsTop').textContent='스킬 포인트 '+fmt(S.pts);
  feverFillEl.style.width=S.fever+'%';
  const fev=feverLeft>0, rd=ready();
  feverBox.classList.toggle('on',fev);
  feverTxt.textContent = fev ? `${feverLeft.toFixed(1)}초 남음 · 쿨타임 ×0.15 · 골드 ×3` : feverLock>0 ? `재충전 대기 ${Math.ceil(feverLock)}초` : `${Math.floor(S.fever)}%`;
  throwBtn.classList.toggle('fever',fev);
  throwBtn.classList.toggle('wait',!rd);
  needleEl.style.left=(needle*100)+'%';
  meter.classList.toggle('dim',!rd);
  cdBar.style.transform=`scaleX(${cdTotal>0?cdLeft/cdTotal:0})`;
  comboBig.textContent=combo;
  comboSub.textContent=`×${comboMult(combo).toFixed(2)} · 최고 ${S.stats.best}`;
  const curM = flight ? bLift/PX : lastPeak;
  hBig.textContent = fmtM(curM);
  hSub.textContent = `${zoneName(curM)} · 최고 ${fmtM(S.stats.maxH)}`;

  let bh='';
  if(golden) bh+=`<div class="buff gold">황금 찬스 ×5${goldenCharges?` (+${goldenCharges})`:''}</div>`;
  if((skAct.slow||0)>0) bh+=`<div class="buff">슬로우 모션 ${skAct.slow.toFixed(1)}초</div>`;
  if((skAct.wide||0)>0) bh+=`<div class="buff">넓은 판정 ${skAct.wide.toFixed(1)}초</div>`;
  if(zones&&zones.jp) bh+=`<div class="buff jp">잭팟 칸 등장 ×100</div>`;
  if(S.robotOn && skLv('robot')) bh+=`<div class="buff">로봇 조수 작동 중</div>`;
  if(buffsEl.innerHTML!==bh) buffsEl.innerHTML=bh;
  updateSkillBar();

  shopTick+=dt;
  if(shopTick>0.2){
    shopTick=0; refreshShop(); refreshStageUI();
    const g=goldFor(combo+1)*(golden?5:1);
    $('iGain').textContent=fmt(g); $('iRev').textContent=fmt(g*10); $('iCd').textContent=cooldown().toFixed(2);
    $('iH').textContent=fmtM(peakM(S.lv.power)/(STG().grav||1));
  }
  prevTick+=dt;
  if(prevTick>0.12 && !$('pane-skin').hidden){ prevTick=0; drawSkinPreviews(); }
  saveTick+=dt; if(saveTick>3){ saveTick=0; save(); }

  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
window.addEventListener('pagehide',save);

resize(); newZones(); buildShop(); buildSkillBar(); drawSkinPreviews(); refreshRecords(); refreshStageUI();
if(!S.introSeen) showStory(0); else setTimeout(()=>setStage(S.stage),100);
requestAnimationFrame(loop);
})();
